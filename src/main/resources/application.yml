spring:
  application:
    name: piku-back
  profiles:
    active: ${PROFILE:dev}
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 7MB
      max-request-size: 7MB
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100
  jpa:
    open-in-view: false
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SUPPORT_EMAIL:piku@gmail.com}
    password: ${EMAIL_PWD:abcd abcd efgh efgh}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
          timeout: 5000
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}

firebase:
  key-path: ${GOOGLE_APPLICATION_CREDENTIALS:firebase-json-key.json}

gemini:
  api:
    key: ${GEMINI_API_KEY:api-key-placeholder}
    base-url: https://generativelanguage.googleapis.com/v1beta
    models:
      image-generation: ${AI_IMAGE_MODEL:gemini-2.5-flash-image}
      chat: gemini-2.0-flash
    timeout: 30s

jwt:
  secret: ${JWT_KEY:LhVYSkvR90p9A7jPFlWWZ0uB3RPiIGnN8s3aXk2lbE4=}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized

monitoring:
  allowed-ips: ${MONITORING_ALLOWED_IPS:172.18.0.0/16,192.168.0.0/16}

storage:
  server-to-s3-url: ${SERVER_TO_S3_URL:http://localhost:9000}
  client-to-s3-url: ${CLIENT_TO_S3_URL:http://localhost:9000}
  region: ap-northeast-2
  access-key: ${STORAGE_ACCESS_KEY:minioadmin}
  secret-key: ${STORAGE_SECRET_KEY:minioadmin}
  bucket: ${STORAGE_BUCKET:piku}
  type: ${STORAGE_TYPE:minio} # minio or s3

image:
  cache:
    public-cache-control: ${IMAGE_PUBLIC_CACHE_CONTROL:public, max-age=300, s-maxage=1200}
    private-cache-control: ${IMAGE_PRIVATE_CACHE_CONTROL:private, no-store, max-age=0}

photo:
  optimization:
    enabled: ${PHOTO_OPTIMIZATION_ENABLED:false}
    fixed-delay-ms: ${PHOTO_OPTIMIZATION_FIXED_DELAY_MS:300000}
    batch-size: ${PHOTO_OPTIMIZATION_BATCH_SIZE:10}
    max-attempts: ${PHOTO_OPTIMIZATION_MAX_ATTEMPTS:3}
    quality: ${PHOTO_OPTIMIZATION_QUALITY:0.82}


admin:
  api:
    account-management-enabled: ${ADMIN_ACCOUNT_MANAGEMENT_API_ENABLED:false}
    onboarding-enabled: ${ADMIN_ONBOARDING_API_ENABLED:false}
  security:
    allowed-origins: ${ADMIN_ALLOWED_ORIGINS:http://localhost:3000, http://localhost:8080}
    session-cookie-name: ${ADMIN_SESSION_COOKIE_NAME:SESSIONID}
    csrf-cookie-name: ${ADMIN_CSRF_COOKIE_NAME:csrf_token}
    csrf-header-name: ${ADMIN_CSRF_HEADER_NAME:csrf_header}
    secure-cookies: true
    csrf-cookie-domain: ${ADMIN_CSRF_COOKIE_DOMAIN:localhost}
  otp:
    encryption-key: ${ADMIN_OTP_ENCRYPTION_KEY}
