plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.pikume'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

// CVE-2025-55163은 Netty 4.1.124.Final 이상에서 해결된다.
ext['netty.version'] = '4.1.124.Final'

def profile = System.getenv("PROFILE") ?: "dev"
def isProd = profile == "prod"

dependencies {
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.8'
	if (!isProd) {
//		implementation 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4.1:1.16'
	}
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	// CVE-2024-31033 관련 JJWT 0.11.5 판단은 아래 코멘트를 참고한다.
	// https://github.com/jwtk/jjwt/issues/930#issuecomment-2032699358
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	// JSON 용도
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
//        implementation 'io.micrometer:micrometer-registry-prometheus'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mysql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
	implementation 'io.minio:minio:9.0.3'
	implementation 'software.amazon.awssdk:s3'
	implementation 'software.amazon.awssdk:auth'
	implementation 'com.github.usefulness:webp-imageio:0.10.2'
	implementation 'com.google.api-client:google-api-client:2.7.2'
	implementation('com.google.firebase:firebase-admin:9.9.0') {
		// Firebase Admin은 FCM 용도로만 사용하고 Firebase Storage XML API는 사용하지 않는다.
		// jackson-dataformat-xml이 MVC 응답에 영향을 줘 JSON 응답 테스트를 깨뜨리므로 아래와 같이 처리한다.
		exclude group: 'com.fasterxml.jackson.dataformat', module: 'jackson-dataformat-xml'
		exclude group: 'com.fasterxml.woodstox', module: 'woodstox-core'
	}
	implementation platform("software.amazon.awssdk:bom:2.25.19")
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'mysql-migration'
	}
}

tasks.register('mysqlMigrationTest', Test) {
	description = 'Runs MySQL Flyway migration tests against a real MySQL container.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'mysql-migration'
	}
	shouldRunAfter tasks.named('test')
}

/**
 * 개발 과정에서만 사용하는 tools 패키지를 배포 JAR에서 제외한다.
 *
 * 소스와 기본 컴파일 결과에는 tools 클래스를 유지하고, 실행 JAR 포장에 사용할
 * 클래스 복사본에서만 제거해 IDE 실행과 개발용 유틸리티 사용에는 영향을 주지 않는다.
 */
def productionClasses = tasks.register('prepareProductionClasses', Sync) {
	from(sourceSets.main.output)
	exclude('com/pikume/back/tools/**')
	into(layout.buildDirectory.dir('production-classes'))
}

tasks.named('bootJar') {
	dependsOn(productionClasses)
	classpath = files(configurations.runtimeClasspath, productionClasses.map { it.destinationDir })
}

/**
 * Spring Boot 실행 JAR이 아닌 일반 JAR에서도 개발 전용 tools 패키지를 제외한다.
 */
tasks.named('jar') {
	exclude('com/pikume/back/tools/**')
}
