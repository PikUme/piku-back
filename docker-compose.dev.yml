services:
  app:
    container_name: piku-dev-app
    depends_on:
      - db
      - redis
      - minio
    build:
      context: .
    env_file:
      - path: .env
        required: false
    environment:
      PROFILE: dev
      SERVER_PORT: ${SERVER_PORT:-8080}
      DEV_DB_URL: jdbc:mysql://db:3306/piku
      REDIS_URL: redis://redis:6379
      SERVER_TO_S3_URL: http://minio:9000
      CLIENT_TO_S3_URL: ${CLIENT_TO_S3_URL:-http://localhost:9000}
      GOOGLE_APPLICATION_CREDENTIALS: /app/firebase-credentials.json
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    volumes:
      - ./logs:/app/logs
      - ./${GOOGLE_APPLICATION_CREDENTIALS:-firebase-json-key.json}:/app/firebase-credentials.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${SERVER_PORT:-8080}/actuator || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  db:
    image: mysql:8.0
    container_name: dev-piku-mysql
    ports:
      - "${DB_PORT:-9915}:3306"
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DEV_DB_PASSWORD:-1234}
      MYSQL_DATABASE: piku
    volumes:
      - dev-piku-data:/var/lib/mysql

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - target: 1025
        published: "${MAILPIT_SMTP_PORT:-1025}"
        host_ip: 127.0.0.1
        protocol: tcp
      - target: 8025
        published: "${MAILPIT_UI_PORT:-8025}"
        host_ip: 127.0.0.1
        protocol: tcp
    restart: unless-stopped

volumes:
  dev-piku-data:
